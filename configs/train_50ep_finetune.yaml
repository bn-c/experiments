# Unified 50-Epoch Fine-Tuning Configuration with Dynamic Unfreezing & LR Dampening

training:
  epochs: 50
  batch_size: 128
  mixed_precision: true       # torch.cuda.amp FP16
  label_smoothing: 0.1
  optimizer: "SGD"
  momentum: 0.9
  weight_decay: 0.0005

scheduler:
  type: "OneCycleLR"
  base_max_lr: 0.01
  pct_start: 0.3              # Warmup over first 15 epochs (30%)
  anneal_strategy: "cos"
  div_factor: 25.0
  final_div_factor: 100.0

unfreezing_schedule:
  dampening_epochs: 3         # Scale newly unfrozen layers linearly over 3 epochs
  stages:
    adapter:
      unfreeze_epoch: 1
      lr_mult: 1.0
    fc:
      unfreeze_epoch: 1
      lr_mult: 10.0
    layer4:
      unfreeze_epoch: 6
      lr_mult: 1.0
    layer3:
      unfreeze_epoch: 8
      lr_mult: 0.1
    layer2:
      unfreeze_epoch: 10
      lr_mult: 0.01
    layer1:
      unfreeze_epoch: 10
      lr_mult: 0.01

data:
  dataset: "ImageNet-100"
  num_classes: 100
  input_resolution: [224, 224]
  num_workers: 4
  huggingface:
    enabled: true
    dataset_name: "clane9/imagenet-100"
    streaming: false # Set true for zero-wait on-the-fly streaming
