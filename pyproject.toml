[project]
name = "drf-vit"
version = "0.1.0"
# Clamp to 3.12: ROCm 7.1 nightlies (torch/triton-rocm) resolve cleanly on CPython 3.12;
# broader ranges pull py3.13/3.14 wheel splits that fail on the desk AMD box.
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "pillow",
    "datasets",
    "huggingface-hub",
    "tqdm",
]

[project.optional-dependencies]
# `scripts/visualize_drf.py --video` decodes video; images only need pillow/numpy.
video = [
    "imageio",
    "imageio-ffmpeg",
]
# The AMD ROCm nightly PyTorch build this project is developed against. Kept out of
# the hard dependencies so `uv sync` still resolves on a CUDA/CPU machine; install it
# with `uv sync --extra rocm` on an AMD box.
# ROCm 7.1 index (`nightly/rocm7.1`); upstream renamed the Triton wheel
# pytorch-triton-rocm → triton-rocm. Lock pins concrete nightly wheels (see uv.lock).
rocm = [
    "triton-rocm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drf", "fracsrf", "linear_bench"]

[tool.uv.sources]
# NOTE: torch is pinned to the ROCm nightly index below because this project is
# developed on an AMD box. On a CUDA/CPU machine, drop these two lines (or run
# `uv sync --no-install-package torch` after a plain `pip install torch`).
torch = { index = "pytorch-rocm-nightly" }
triton-rocm = { index = "pytorch-rocm-nightly" }

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 is left to the formatter; the model docstrings are deliberately wide.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/visualize_drf.py" = ["E402"]
"scripts/check_fovi_mapping.py" = ["E402"]
"sfprm_miniarc/train.py" = ["E402"]
"sfprm_miniarc/evaluate.py" = ["E402"]
"sfprm_miniarc/test_smoke.py" = ["E402"]
"sfprm_miniarc/data/download_miniarc.py" = ["E402"]

[[tool.uv.index]]
name = "pytorch-rocm-nightly"
url = "https://download.pytorch.org/whl/nightly/rocm7.1"
explicit = true
