[project]
name = "drf-vit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pytorch-triton-rocm",
    "numpy",
    "pillow",
    "datasets",
    "huggingface-hub",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drf", "fracsrf"]

[tool.uv.sources]
torch = { index = "pytorch-rocm-nightly" }
pytorch-triton-rocm = { index = "pytorch-rocm-nightly" }

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-rocm-nightly"
url = "https://download.pytorch.org/whl/nightly/rocm6.4"
explicit = true
